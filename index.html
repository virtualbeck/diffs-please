<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Diffs, Please</title>
<meta name="description" content="A small pixel game that teaches you to run AI coding agents with the mattpocock/skills workflow. No coding knowledge needed.">
<meta name="theme-color" content="#12110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diffs, Please">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" class="defs" aria-hidden="true"><defs>
<symbol id="bot" viewBox="0 0 8 11"><rect x="3" y="0" width="2" height="1" fill="currentColor"/><rect x="1" y="1" width="6" height="4" fill="currentColor"/><rect x="2" y="2" width="1" height="1" fill="#e8a33d"/><rect x="5" y="2" width="1" height="1" fill="#e8a33d"/><rect x="2" y="5" width="4" height="4" fill="currentColor"/><rect x="5" y="6" width="3" height="3" fill="#fff"/><rect x="2" y="9" width="1" height="2" fill="#12110f"/><rect x="5" y="9" width="1" height="2" fill="#12110f"/></symbol>
<symbol id="human" viewBox="0 0 8 11"><rect x="2" y="0" width="4" height="1" fill="#2a2b24"/><rect x="2" y="1" width="4" height="3" fill="#c9a27e"/><rect x="3" y="2" width="1" height="1" fill="#12110f"/><rect x="5" y="2" width="1" height="1" fill="#12110f"/><rect x="1" y="4" width="6" height="5" fill="currentColor"/><rect x="3" y="4" width="1" height="3" fill="#fff"/><rect x="2" y="9" width="1" height="2" fill="#12110f"/><rect x="5" y="9" width="1" height="2" fill="#12110f"/></symbol>
<symbol id="hood" viewBox="0 0 8 11"><rect x="2" y="0" width="4" height="1" fill="currentColor"/><rect x="1" y="1" width="6" height="4" fill="currentColor"/><rect x="2" y="2" width="4" height="2" fill="#12110f"/><rect x="3" y="2" width="1" height="1" fill="#d9cfb4"/><rect x="5" y="2" width="1" height="1" fill="#d9cfb4"/><rect x="1" y="5" width="6" height="6" fill="currentColor"/></symbol>
</defs></svg>
<div id="app">
  <header id="hud">
    <div class="px" id="day">DAY 1</div>
    <div class="ctx"><span class="lbl px">Context</span><div id="bar" role="img" aria-label="Context left"><div id="barfill"></div></div></div>
    <div id="tok" class="px">100K LEFT</div>
    <button class="hbtn px" id="snd" type="button" aria-label="Sound on. Tap to mute"></button>
    <button class="hbtn q px" id="help" type="button" aria-label="Open the cheat sheet">?</button>
  </header>
  <main id="page" aria-live="polite"></main>
  <div id="sheet" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
